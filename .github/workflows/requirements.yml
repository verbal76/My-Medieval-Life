# Requirements register validation (owner directive 2026-10-23, REQ-CTRL-01): structural checks only, no game suites.
# Fails on duplicate ids, broken references, invalid statuses, unrecorded status changes or stale generated views;
# never on legitimately unfinished work.
name: Requirements register

on:
  push:
    branches: [staging/my-medieval-life]
    paths: ["docs/requirements/**", "docs/directives/**", "docs/CURRENT_DEVELOPMENT_STATE.md", "docs/PROJECT_MEMORY.md",
            "docs/DEVELOPMENT_LEDGER.md", "tools/check_requirements.py", "tools/requirements_report.py",
            "tools/requirements_update.py", "tools/ci_report.py", "tests/test_requirements.py", ".github/workflows/requirements.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch the integration branches named by records (paths are checked there too)
        run: |
          for b in staging/my-medieval-life wip/build18 wip/build17 wip/expansion18-preparation wip/expansion19-preparation wip/expansion20-preparation wip/expansion21-preparation; do
            git fetch --depth=1 origin "$b:refs/remotes/origin/$b" || echo "note: $b not fetched"
          done
          # audit 2026-11-13 (docs/audits/2026-11-13_INHERITED_FAILURES_AUDIT.md): a branch not fetched makes the register's
          # path check undecidable and silently weaker, so fail here, loudly, instead of passing with less checked
          python3 tools/check_test_env.py --strict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # HAG-MEM-02 Part 3: both checks run even when the first fails; the job summary and ci-report.json say which failed.
      - name: Validate the register and its generated views, and the register tests
        id: register
        run: |
          printf '%s\n' 'python3 tools/check_requirements.py --against HEAD~1' 'python3 -m unittest tests.test_requirements -v' > "$RUNNER_TEMP/register.txt"
          python3 tools/ci_report.py run --group register --list "$RUNNER_TEMP/register.txt" --logs ci-out/logs --results ci-out/results.jsonl
      - name: Report (job summary and ci-report.json)
        if: always()
        run: |
          python3 tools/ci_report.py report --results ci-out/results.jsonl --expect register \
            --step register=${{ steps.register.outcome }} \
            --purpose "Structural validation of the requirements register and its generated views (REQ-CTRL-01; ${{ github.event_name }})" \
            --json ci-out/ci-report.json --markdown "$GITHUB_STEP_SUMMARY" > /dev/null
      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: warn
          retention-days: 30
