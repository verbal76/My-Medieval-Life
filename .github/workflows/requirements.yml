# Requirements register validation (owner directive 2026-10-23, REQ-CTRL-01): structural checks only, no game suites.
# Fails on duplicate ids, broken references, invalid statuses, unrecorded status changes or stale generated views;
# never on legitimately unfinished work.
name: Requirements register

on:
  push:
    branches: [staging/my-medieval-life]
    paths: ["docs/requirements/**", "docs/directives/**", "docs/CURRENT_DEVELOPMENT_STATE.md", "docs/PROJECT_MEMORY.md",
            "docs/DEVELOPMENT_LEDGER.md", "tools/check_requirements.py", "tools/requirements_report.py",
            "tools/requirements_update.py", "tests/test_requirements.py", ".github/workflows/requirements.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch, check and record the integration branches named by records (paths are checked there too)
        run: |
          # Audit 2026-11-13 (docs/audits/2026-11-13_INHERITED_FAILURES_AUDIT.md on the code line; owner Build 42 directive
          # section 2): the branches come from the register check's own PATH_REFS (8 here, wip/expansion20 included; no second
          # list to drift), are fetched from GitHub, compared with GitHub (git ls-remote) and recorded with the commit under
          # test; a branch that cannot be fetched, a stale ref or a missing HEAD~1 (for --against HEAD~1) fails here as an
          # ENVIRONMENT failure instead of silently weakening or falsifying the register check.
          python3 tools/check_test_env.py --fetch --strict --require-authority --candidate "${{ github.sha }}" \
            --require-commit HEAD~1 --record ci-out/test-env.json
          cat ci-out/test-env.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the register and its generated views
        run: python3 tools/check_requirements.py --against HEAD~1
      - name: Register tests
        run: python3 -m unittest tests.test_requirements -v
