name: JUS-03 focused old-age justice regression
on:
  push:
    branches: [audit/jus03-age-death-case-20261108]
    paths: ["game/tests/jus03_old_age_justice_test.gd", "game/scripts/core/life.gd", ".github/workflows/jus03-focused.yml"]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-linux-editor
      - name: Install Godot editor if necessary
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSfL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 ~/godot-bin/godot
      - name: Import
        run: ~/godot-bin/godot --headless --path game --import >/tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
      - name: Single focused test
        run: ~/godot-bin/godot --headless --path game --script res://tests/jus03_old_age_justice_test.gd
