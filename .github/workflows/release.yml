# Builds the game for Android, Windows and Linux from one source revision, with one shared build
# number, and keeps them together as a GitHub Release.
#
# Owner's release policy (docs/DECISIONS.md, 2026-10-18): a build is a deliberate decision by the
# owner. This workflow never runs on a push: it is started by hand ("Run workflow") on an approved
# commit. The default, "private", makes a draft release that only people with write access to the
# repository can see or download (no tag exists until the owner publishes it). "public" publishes it
# and needs all three of: the owner's approval for that occasion, the confirmation text below, and
# an approval in the "public-release" environment (the owner makes their own account its required reviewer in
# Settings > Environments; see docs/release/AUDIT_REMEDIATION.md).
#
# Android builds are signed with the owner's permanent release identity from the four ANDROID_RELEASE_* repository
# secrets (owner, 2026-10-24, from Build 21; docs/release/ANDROID_SIGNING.md). Godot exports the APK unsigned and
# apksigner signs it with the keystore password and the key password as given (never assumed equal), then verifies it
# and records the certificate's SHA-256 fingerprint. There is no fallback: a missing secret or a failed signing stops
# the build, and no credential is ever printed.
#
# SIM-GATE-01 (owner, 2026-10-24, permanent; amended the same day): before anything is packaged, the "sim-gate" job runs the
# village simulation suite with the flight recorder on (tools/sim_suite.py) on this same commit, writes the analysis
# workbook with the game's own exporter and checks it. The "build" job needs it: a failed gate packages nothing. The gate's
# results (workbook, summary, gate.json, logs, analyses) are uploaded as the workflow artifact "sim-gate" whether it passes
# or fails; the workbook is an internal CI artifact, never attached to the release; the release notes carry a short
# summary with the gate's run id and the recorder schema.
name: Build and release

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: "private = draft release, visible only to collaborators; public = published release (owner approval for public distribution only)"
        type: choice
        options: [private, public]
        default: private
      confirm_public:
        description: "Only for visibility=public: type exactly  publish publicly"
        type: string
        default: ""
      build_number:
        description: "Build number to stamp (digits only; empty = this run's number). Use it when a failed run used up a number"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  sim-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its export templates
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q -j templates.tpz -d "$dest"
          rm godot.zip templates.tpz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import the project
        run: ~/godot-bin/godot --headless --path game --import

      - name: Run the simulation gate (SIM-GATE-01)
        env:
          BUILD_N: ${{ inputs.build_number || github.run_number }}
        run: |
          # every scenario with the flight recorder on, in parallel; exit 1 on any blocking finding (never on hardship)
          python3 tools/sim_suite.py --out out/sim-gate --godot ~/godot-bin/godot --jobs "$(nproc)"

      - name: Keep the gate's results (also when it fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-gate
          retention-days: 90
          if-no-files-found: warn
          path: |
            out/sim-gate/gate.json
            out/sim-gate/SIM_GATE_SUMMARY.md
            out/sim-gate/sim_gate_workbook.xlsx
            out/sim-gate/*/sim.json
            out/sim-gate/*/run.log
            out/sim-gate/*/analysis.json
            out/sim-gate/*/probe.json

      - name: Keep the recorder archives (also when the gate fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-gate-archives
          retention-days: 14
          if-no-files-found: warn
          path: out/sim-gate/*/rec/

  build:
    needs: sim-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # a public release waits here for the owner's approval in the protected environment
    environment: ${{ inputs.visibility == 'public' && 'public-release' || 'private-testing' }}
    steps:
      - name: Check the request
        env:
          VISIBILITY: ${{ inputs.visibility }}
          CONFIRM: ${{ inputs.confirm_public }}
        run: |
          if [ "$VISIBILITY" = "public" ] && [ "$CONFIRM" != "publish publicly" ]; then
            echo "::error::A public release needs confirm_public set to 'publish publicly' (and the owner's approval)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and its export templates
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q -j templates.tpz -d "$dest"
          rm godot.zip templates.tpz

      - name: Put Godot on the path
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Point Godot at the Android SDK and the JDK, and check the release-signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Android release signing secrets missing (ANDROID_RELEASE_*:$missing; docs/release/ANDROID_SIGNING.md). No fallback key is made: the build stops."
            exit 1
          fi
          umask 077
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-release.keystore" 2>/dev/null \
             || [ ! -s "$RUNNER_TEMP/android-release.keystore" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 does not decode to a keystore file. The build stops."
            exit 1
          fi
          # Godot exports the APK unsigned (package/signed=false below) and apksigner signs it in the export step. The
          # keystore is also named here only because Godot's export check may ask for one; it signs nothing with it.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/android-release.keystore"
          export/android/debug_keystore_user = "${KEY_ALIAS}"
          export/android/debug_keystore_pass = "${KEYSTORE_PASSWORD}"
          EOF

      - name: Fetch the music as WAV (Windows and Linux carry it; Android carries Ogg)
        # MUSIC-18: the owner's three songs are release assets of this repository (173 MB, never committed), and the two
        # Minifantasy songs come from the zip in the owner's Minifantasy release (the pack is never committed). Each is checked
        # against the size and sha256 in game/data/music.json, and saved with an import file that keeps plain PCM. The
        # Android preset excludes the WAVs and the PC presets exclude the Ogg copies (game/export_presets.cfg).
        run: python3 tools/fetch_music.py

      - name: Import the project and run the tests
        run: |
          godot --headless --path game --import
          godot --headless --path game --script res://tests/run_tests.gd
          godot --headless --path game --script res://tests/start_test.gd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the icon check's one dependency (Pillow)
        run: python3 -m pip install pillow==10.4.0

      - name: Stamp the build number into the versions
        env:
          BUILD_N: ${{ inputs.build_number || github.run_number }}
        run: |
          n="$BUILD_N"
          case "$n" in ''|*[!0-9]*) echo "::error::build_number must be digits only"; exit 1 ;; esac
          # Android needs a rising version code to update an install; Windows shows the file version
          sed -i -E "s/^package\/signed=.*/package\/signed=false/; s/^version\/code=.*/version\/code=${n}/; s/^version\/name=.*/version\/name=\"0.1.${n}-test\"/; s/^application\/file_version=.*/application\/file_version=\"0.1.${n}.0\"/; s/^application\/product_version=.*/application\/product_version=\"0.1.${n}.0\"/" game/export_presets.cfg
          grep -E '^(package/signed|version/code|version/name|application/file_version|application/product_version)=' game/export_presets.cfg
          # the build the game reports at run time (saves record the builds they passed through: SAVE-02)
          sed -i "/^\[application\]/a config/version=\"0.1.${n}-test\"" game/project.godot
          grep -E '^config/version=' game/project.godot

      - name: Export Android, Windows and Linux
        env:
          BUILD_N: ${{ inputs.build_number || github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p out/pc/windows out/pc/linux release
          godot --headless --path game --export-debug "Android" ../out/mymedievallife-unsigned.apk
          # SIM-GATE-01 amendment: the APK carries no workbook or desktop export code (export_presets.cfg exclude_filter)
          if unzip -l out/mymedievallife-unsigned.apk | grep -E "recorder_export|sim_workbook"; then
            echo "::error::the Android package contains the desktop recording export (scripts/recorder_export or data/sim_workbook.json)"
            exit 1
          fi
          # sign with the permanent release identity (the two passwords are passed separately, never assumed equal)
          tools_dir="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          # 16 KB page alignment for native libraries (Android 15 devices); older build-tools know only -p (4 KB)
          "${tools_dir}zipalign" -f -P 16 4 out/mymedievallife-unsigned.apk out/mymedievallife-aligned.apk \
            || "${tools_dir}zipalign" -f -p 4 out/mymedievallife-unsigned.apk out/mymedievallife-aligned.apk
          if ! "${tools_dir}apksigner" sign --ks "$RUNNER_TEMP/android-release.keystore" \
               --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
               --out out/mymedievallife-dev.apk out/mymedievallife-aligned.apk > out/apksigner-sign.log 2>&1; then
            # the log is kept on the runner only and never printed (no credential can reach the job log)
            echo "::error::apksigner could not sign the APK with the ANDROID_RELEASE_* identity (wrong keystore password, alias or key password, or an unreadable keystore). No fallback key is used: the build stops."
            exit 1
          fi
          "${tools_dir}apksigner" verify --verbose --print-certs out/mymedievallife-dev.apk > out/apk-signature.txt
          grep -E "^Verifies|Verified using|Signer #1 certificate (DN|SHA-256)|Number of signers" out/apk-signature.txt
          fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' out/apk-signature.txt | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          if [ -z "$fingerprint" ] || ! grep -q "^Verifies" out/apk-signature.txt; then
            echo "::error::the signed APK did not verify (apksigner verify)"
            exit 1
          fi
          echo "APK_CERT_SHA256=${fingerprint}" >> "$GITHUB_ENV"
          echo "Release certificate SHA-256: ${fingerprint}"
          # Build 21 (LAN play): the APK's manifest must ask for the network permissions (granted at install, no prompt)
          aapt="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)aapt"
          "$aapt" dump badging out/mymedievallife-dev.apk | grep -E "^package:" | tee out/apk-package.txt
          "$aapt" dump permissions out/mymedievallife-dev.apk | tee out/apk-permissions.txt
          for perm in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_WIFI_MULTICAST_STATE; do
            if ! grep -q "android.permission.${perm}'\?\$" out/apk-permissions.txt; then
              echo "::error::the APK's manifest lacks android.permission.${perm} (game/export_presets.cfg)"
              exit 1
            fi
          done
          godot --headless --path game --export-release "Windows Desktop" ../out/pc/windows/MyMedievalLife.exe
          # the .exe must carry the game's icon (Godot 4.7 embeds application/icon itself: no rcedit/Wine)
          python3 tools/check_exe_icon.py out/pc/windows/MyMedievalLife.exe
          godot --headless --path game --export-release "Linux" ../out/pc/linux/MyMedievalLife.x86_64
          n="$BUILD_N"
          cp out/mymedievallife-dev.apk "release/MyMedievalLife-build${n}-android.apk"
          (cd out/pc/windows && zip -q -9 "$GITHUB_WORKSPACE/release/MyMedievalLife-build${n}-windows-x86_64.zip" MyMedievalLife.exe)
          (cd out/pc/linux && zip -q -9 "$GITHUB_WORKSPACE/release/MyMedievalLife-build${n}-linux-x86_64.zip" MyMedievalLife.x86_64)
          ls -la release
          { echo "Android signing certificate of MyMedievalLife-build${n}-android.apk (apksigner verify --print-certs)"
            echo "SHA-256 fingerprint: ${fingerprint}"
            cat out/apk-package.txt
            grep -E "^Verifies|Verified using|Signer #1 certificate|Number of signers" out/apk-signature.txt; } > "release/MyMedievalLife-build${n}-android-signature.txt"
          sha256sum release/* > release/SHA256SUMS.txt
          { if [ "${{ inputs.visibility }}" != "public" ]; then echo "**Private testing build:** a draft release, visible only to the repository's collaborators. Not for distribution."; echo; fi
            echo "Build ${n}, from \`${{ github.ref_name }}\` at commit ${{ github.sha }}. Linux, Windows and Android are built from that one commit."
            echo
            echo "- **Android:** \`MyMedievalLife-build${n}-android.apk\`, signed with the permanent release key (certificate SHA-256 \`${fingerprint}\`; details in \`MyMedievalLife-build${n}-android-signature.txt\`). Later builds signed with this key install over it and keep the save. Builds signed with earlier keys cannot be updated by it: in the earlier build export your save (Settings > Saves) to a folder outside the app, check the file is there, uninstall the earlier build, install this one (allow installs from unknown sources) and import the save."
            echo "- **Windows:** unzip and run \`MyMedievalLife.exe\`"
            echo "- **Linux:** unzip and run \`MyMedievalLife.x86_64\`"
            echo "- \`SHA256SUMS.txt\` lists each file's checksum."
            echo
            # the build's own tester notes (what is new, known limitations) when they exist (owner release condition 5)
            if [ -f "docs/release/BUILD_${n}_TESTER_NOTES.md" ]; then cat "docs/release/BUILD_${n}_TESTER_NOTES.md"; echo; fi
            cat docs/release/TESTING_CHECKLIST.md; } > notes.md

      - name: Add the simulation gate's summary to the notes
        uses: actions/download-artifact@v4
        with:
          name: sim-gate
          path: sim-gate

      - name: Check the gate ran on this commit and write its section of the notes
        run: |
          python3 - <<'PY'
          import json, os, sys
          g = json.load(open("sim-gate/gate.json"))
          if g["commit"] != os.environ["GITHUB_SHA"] or not g["result"].startswith("PASS") or g.get("subset") or g.get("injected"):
              sys.exit("::error::the simulation gate did not pass on this commit (%s, %s)" % (g["commit"], g["result"]))
          summary = open("sim-gate/SIM_GATE_SUMMARY.md").read()
          with open("notes.md", "a") as f:
              f.write("\n" + summary + "\n- Simulation gate run: %s/%s/actions/runs/%s (artifact `sim-gate`); recorder schema `%s`.\n" % (
                  os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"], g["schema"]))
          PY

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.keystore" "$HOME/.config/godot/editor_settings-4.7.tres"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_number || github.run_number }}
          target_commitish: ${{ github.sha }}
          name: My Medieval Life Build ${{ inputs.build_number || github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          draft: ${{ inputs.visibility != 'public' }}
          body_path: notes.md
          files: release/*
