# Builds the game for Android, Windows and Linux from one source revision, with one shared build
# number, and keeps them together as a GitHub Release.
#
# Owner's release policy (docs/DECISIONS.md, 2026-10-18): a build is a deliberate decision by the
# owner. This workflow never runs on a push: it is started by hand ("Run workflow") on an approved
# commit. The default, "private", makes a draft release that only people with write access to the
# repository can see or download (no tag exists until the owner publishes it). "public" publishes it
# and needs all three of: the owner's approval for that occasion, the confirmation text below, and
# an approval in the "public-release" environment (the owner makes their own account its required reviewer in
# Settings > Environments; see docs/release/AUDIT_REMEDIATION.md).
#
# Android builds are signed with the owner's permanent release identity from the four ANDROID_RELEASE_* repository
# secrets (owner, 2026-10-24, from Build 21; docs/release/ANDROID_SIGNING.md). Godot exports the APK unsigned and
# apksigner signs it with the keystore password and the key password as given (never assumed equal), then verifies it
# and records the certificate's SHA-256 fingerprint. There is no fallback: a missing secret or a failed signing stops
# the build, and no credential is ever printed.
#
# SIM-GATE-01 (owner, 2026-10-24, permanent; amended the same day): before anything is packaged, the "sim-gate" job runs the
# village simulation suite with the flight recorder on (tools/sim_suite.py) on this same commit, writes the analysis
# workbook with the game's own exporter and checks it. The "release" job needs it: a failed gate publishes nothing (the six
# package jobs build in parallel with it; DEMO-01). The gate's
# results (workbook, summary, gate.json, logs, analyses) are uploaded as the workflow artifact "sim-gate" whether it passes
# or fails; the workbook is an internal CI artifact, never attached to the release; the release notes carry a short
# summary with the gate's run id and the recorder schema.
name: Build and release

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: "private = draft release, visible only to collaborators; public = published release (owner approval for public distribution only)"
        type: choice
        options: [private, public]
        default: private
      confirm_public:
        description: "Only for visibility=public: type exactly  publish publicly"
        type: string
        default: ""
      build_number:
        description: "Build number to stamp (digits only; empty = this run's number). Use it when a failed run used up a number"
        type: string
        default: ""
      reuse_gate_run:
        description: "Owner-approved only (private builds): an earlier release run whose simulation gate passed; reused instead of running the gate, when nothing the simulation runs has changed since"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  sim-gate:
    if: inputs.reuse_gate_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its export templates
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q -j templates.tpz -d "$dest"
          rm godot.zip templates.tpz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import the project
        run: ~/godot-bin/godot --headless --path game --import

      - name: Run the simulation gate (SIM-GATE-01)
        env:
          BUILD_N: ${{ inputs.build_number || github.run_number }}
        run: |
          # every scenario with the flight recorder on, in parallel; exit 1 on any blocking finding (never on hardship)
          python3 tools/sim_suite.py --out out/sim-gate --godot ~/godot-bin/godot --jobs "$(nproc)"

      - name: Keep the gate's results (also when it fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-gate
          retention-days: 90
          if-no-files-found: warn
          path: |
            out/sim-gate/gate.json
            out/sim-gate/SIM_GATE_SUMMARY.md
            out/sim-gate/sim_gate_workbook.xlsx
            out/sim-gate/*/sim.json
            out/sim-gate/*/run.log
            out/sim-gate/*/analysis.json
            out/sim-gate/*/probe.json

      - name: Keep the recorder archives (also when the gate fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-gate-archives
          retention-days: 14
          if-no-files-found: warn
          path: out/sim-gate/*/rec/

  # DEMO-01 (owner 2026-11-03): six packages from this one commit, built in parallel: the full game and the demo (the same source
  # exported with the "demo" feature: game/export_presets.cfg "... Demo" presets), each for Android, Windows and Linux. No package
  # waits for another; the release job collects them, checks them and makes the private draft.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # a public release waits here for the owner's approval in the protected environment
    environment: ${{ inputs.visibility == 'public' && 'public-release' || 'private-testing' }}
    strategy:
      fail-fast: false
      matrix:
        target: [android, windows, linux]
        edition: [full, demo]
    name: package (${{ matrix.edition }}, ${{ matrix.target }})
    env:
      BUILD_N: ${{ inputs.build_number || github.run_number }}
      SUFFIX: ${{ matrix.edition == 'demo' && '-Demo' || '' }}
      PRESET_SUFFIX: ${{ matrix.edition == 'demo' && ' Demo' || '' }}
    steps:
      - name: Check the request
        env:
          VISIBILITY: ${{ inputs.visibility }}
          CONFIRM: ${{ inputs.confirm_public }}
        run: |
          if [ "$VISIBILITY" = "public" ] && [ "$CONFIRM" != "publish publicly" ]; then
            echo "::error::A public release needs confirm_public set to 'publish publicly' (and the owner's approval)."
            exit 1
          fi
          case "$BUILD_N" in ''|*[!0-9]*) echo "::error::build_number must be digits only"; exit 1 ;; esac

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and its export templates
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q -j templates.tpz -d "$dest"
          rm godot.zip templates.tpz

      - name: Put Godot on the path
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Point Godot at the Android SDK and the JDK, and check the release-signing secrets are present
        if: matrix.target == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Android release signing secrets missing (ANDROID_RELEASE_*:$missing; docs/release/ANDROID_SIGNING.md). No fallback key is made: the build stops."
            exit 1
          fi
          umask 077
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-release.keystore" 2>/dev/null \
             || [ ! -s "$RUNNER_TEMP/android-release.keystore" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 does not decode to a keystore file. The build stops."
            exit 1
          fi
          # Godot exports the APK unsigned (package/signed=false below) and apksigner signs it in the export step. The
          # keystore is also named here only because Godot's export check may ask for one; it signs nothing with it.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/android-release.keystore"
          export/android/debug_keystore_user = "${KEY_ALIAS}"
          export/android/debug_keystore_pass = "${KEYSTORE_PASSWORD}"
          EOF

      - name: Fetch the music as WAV (Windows and Linux carry it; Android carries Ogg)
        # MUSIC-18: the owner's three songs are release assets of this repository (173 MB, never committed), and the two
        # Minifantasy songs come from the zip in the owner's Minifantasy release (the pack is never committed). Each is checked
        # against the size and sha256 in game/data/music.json. The Android presets exclude the WAVs and the PC presets the Ogg copies.
        if: matrix.target != 'android'
        run: python3 tools/fetch_music.py

      - name: Import the project and run the tests (once, in the full Linux cell)
        run: |
          godot --headless --path game --import
          if [ "${{ matrix.target }}-${{ matrix.edition }}" = "linux-full" ]; then
            godot --headless --path game --script res://tests/run_tests.gd
            godot --headless --path game --script res://tests/start_test.gd
            godot --headless --path game --script res://tests/demo_test.gd
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the icon check's one dependency (Pillow)
        if: matrix.target == 'windows'
        run: python3 -m pip install pillow==10.4.0

      - name: Stamp the build number into the versions
        run: |
          n="$BUILD_N"
          # Android needs a rising version code to update an install; Windows shows the file version
          sed -i -E "s/^package\/signed=.*/package\/signed=false/; s/^version\/code=.*/version\/code=${n}/; s/^version\/name=.*/version\/name=\"0.1.${n}-test\"/; s/^application\/file_version=.*/application\/file_version=\"0.1.${n}.0\"/; s/^application\/product_version=.*/application\/product_version=\"0.1.${n}.0\"/" game/export_presets.cfg
          grep -E '^(package/signed|version/code|version/name|application/file_version|application/product_version)=' game/export_presets.cfg
          # the build the game reports at run time (saves record the builds they passed through: SAVE-02)
          sed -i "/^\[application\]/a config/version=\"0.1.${n}-test\"" game/project.godot
          grep -E '^config/version=' game/project.godot

      - name: Export Android (${{ matrix.edition }})
        if: matrix.target == 'android'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p out pkg
          godot --headless --path game --export-debug "Android${PRESET_SUFFIX}" ../out/unsigned.apk
          # SIM-GATE-01 amendment: the APK carries no workbook or desktop export code (export_presets.cfg exclude_filter)
          if unzip -l out/unsigned.apk | grep -E "recorder_export|sim_workbook"; then
            echo "::error::the Android package contains the desktop recording export (scripts/recorder_export or data/sim_workbook.json)"
            exit 1
          fi
          tools_dir="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          # 16 KB page alignment for native libraries (Android 15 devices); older build-tools know only -p (4 KB)
          "${tools_dir}zipalign" -f -P 16 4 out/unsigned.apk out/aligned.apk || "${tools_dir}zipalign" -f -p 4 out/unsigned.apk out/aligned.apk
          apk="pkg/MyMedievalLife-B${BUILD_N}${SUFFIX}-Android.apk"
          if ! "${tools_dir}apksigner" sign --ks "$RUNNER_TEMP/android-release.keystore" \
               --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
               --out "$apk" out/aligned.apk > out/apksigner-sign.log 2>&1; then
            # the log is kept on the runner only and never printed (no credential can reach the job log)
            echo "::error::apksigner could not sign the APK with the ANDROID_RELEASE_* identity. No fallback key is used: the build stops."
            exit 1
          fi
          "${tools_dir}apksigner" verify --verbose --print-certs "$apk" > out/apk-signature.txt
          grep -E "^Verifies|Verified using|certificate (DN|SHA-256)|Number of signers" out/apk-signature.txt
          digests="$(sed -n 's/^.*certificate SHA-256 digest: *//p' out/apk-signature.txt | sort -u)"
          fingerprint="$(printf '%s' "$digests" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          if [ -z "$digests" ] || [ "$(printf '%s\n' "$digests" | wc -l)" != "1" ] || ! grep -q "^Verifies" out/apk-signature.txt; then
            echo "::error::the signed APK did not verify, or apksigner printed no single certificate SHA-256 (apksigner verify)"
            exit 1
          fi
          aapt="${tools_dir}aapt"
          "$aapt" dump badging "$apk" | grep -E "^package:" | tee out/apk-package.txt
          # the full game keeps the owner's package id; the demo has its own, so both install side by side (DEMO-01)
          want="com.hotatticgames.mymedievallife.dev"
          [ "${{ matrix.edition }}" = "demo" ] && want="com.hotatticgames.mymedievallife.dev.demo"
          grep -q "name='${want}'" out/apk-package.txt || { echo "::error::the APK's package id is not ${want}"; exit 1; }
          "$aapt" dump permissions "$apk" | tee out/apk-permissions.txt
          for perm in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_WIFI_MULTICAST_STATE; do
            if ! grep -q "android.permission.${perm}'\?\$" out/apk-permissions.txt; then
              echo "::error::the APK's manifest lacks android.permission.${perm} (game/export_presets.cfg)"
              exit 1
            fi
          done
          { echo "Android signing certificate of $(basename "$apk") (apksigner verify --print-certs)"
            echo "SHA-256 fingerprint: ${fingerprint}"
            cat out/apk-package.txt
            grep -E "^Verifies|Verified using|certificate (DN|SHA-256)|Number of signers" out/apk-signature.txt; } > "${apk%.apk}-signature.txt"

      - name: Export Windows (${{ matrix.edition }})
        if: matrix.target == 'windows'
        run: |
          mkdir -p out/win pkg
          exe="MyMedievalLife${SUFFIX/-/}.exe"
          godot --headless --path game --export-release "Windows Desktop${PRESET_SUFFIX}" "../out/win/${exe}"
          # the .exe must carry the game's icon (Godot 4.7 embeds application/icon itself: no rcedit/Wine)
          python3 tools/check_exe_icon.py "out/win/${exe}"
          (cd out/win && zip -q -9 "$GITHUB_WORKSPACE/pkg/MyMedievalLife-B${BUILD_N}${SUFFIX}-Windows.zip" "${exe}")

      - name: Export Linux (${{ matrix.edition }})
        if: matrix.target == 'linux'
        run: |
          mkdir -p out/lin pkg
          bin="MyMedievalLife${SUFFIX/-/}.x86_64"
          godot --headless --path game --export-release "Linux${PRESET_SUFFIX}" "../out/lin/${bin}"
          # launch smoke check: the exported game starts headless and quits (DEMO-01: export and launch checks)
          timeout 120 "out/lin/${bin}" --headless --quit-after 300 > out/launch.log 2>&1 || { echo "::error::the Linux ${{ matrix.edition }} build did not start and quit cleanly"; tail -20 out/launch.log; exit 1; }
          if grep -q "SCRIPT ERROR" out/launch.log; then echo "::error::script errors when the Linux ${{ matrix.edition }} build started"; grep -m5 "SCRIPT ERROR" out/launch.log; exit 1; fi
          # B25R1 leak gate: a resource or object still alive at exit (a static cache holding scripts) fails the build
          if grep -qE "resources still in use at exit|ObjectDB instances? (were|was) leaked" out/launch.log; then echo "::error::leak at exit when the Linux ${{ matrix.edition }} build quit"; tail -40 out/launch.log; exit 1; fi
          (cd out/lin && zip -q -9 "$GITHUB_WORKSPACE/pkg/MyMedievalLife-B${BUILD_N}${SUFFIX}-Linux.zip" "${bin}")

      - name: Remove the signing key from the runner
        if: always() && matrix.target == 'android'
        run: rm -f "$RUNNER_TEMP/android-release.keystore" "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.edition }}-${{ matrix.target }}
          path: pkg/*
          if-no-files-found: error
          retention-days: 30

  # Launch smoke check of the two Windows packages on Windows (the Linux packages are launched in their own package jobs).
  smoke-windows:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        edition: [full, demo]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.edition }}-windows
          path: pkg
      - name: Unzip, start headless and quit
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath run
          $exe = Get-ChildItem run -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--headless","--quit-after","300" -PassThru -Wait -RedirectStandardOutput out.log -RedirectStandardError err.log
          Get-Content out.log, err.log -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { Write-Error "the Windows ${{ matrix.edition }} build exited with $($p.ExitCode)"; exit 1 }
          if (Select-String -Path out.log, err.log -Pattern "SCRIPT ERROR" -Quiet) { Write-Error "script errors when the Windows ${{ matrix.edition }} build started"; exit 1 }
          # B25R1 leak gate: a resource or object still alive at exit (a static cache holding scripts) fails the build
          if (Select-String -Path out.log, err.log -Pattern 'resources still in use at exit|ObjectDB instances? (were|was) leaked' -Quiet) { Select-String -Path out.log, err.log -Pattern 'still in use at exit|leaked at exit|Leaked instance' | Select-Object -First 20; Write-Error "leak at exit when the Windows ${{ matrix.edition }} build quit"; exit 1 }

  release:
    needs: [sim-gate, package, smoke-windows]
    # the gate passed on this commit, or (owner-approved, private only) an earlier run's passing gate is reused: see below
    if: always() && needs.package.result == 'success' && needs.smoke-windows.result == 'success' && (needs.sim-gate.result == 'success' || (needs.sim-gate.result == 'skipped' && inputs.reuse_gate_run != '' && inputs.visibility == 'private'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.visibility == 'public' && 'public-release' || 'private-testing' }}
    env:
      BUILD_N: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # a reused gate is checked against the diff since its commit

      - name: Collect the six packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: release
          merge-multiple: true

      - name: Check all six are here, and write the checksums and the notes
        run: |
          n="$BUILD_N"
          for f in "MyMedievalLife-B${n}-Android.apk" "MyMedievalLife-B${n}-Windows.zip" "MyMedievalLife-B${n}-Linux.zip" \
                   "MyMedievalLife-B${n}-Demo-Android.apk" "MyMedievalLife-B${n}-Demo-Windows.zip" "MyMedievalLife-B${n}-Demo-Linux.zip"; do
            [ -s "release/$f" ] || { echo "::error::missing package: $f (a build with fewer than six packages is not complete)"; exit 1; }
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          (cd release && for f in *.apk *.zip; do printf '%s\t%s bytes\n' "$f" "$(stat -c %s "$f")"; done > SIZES.txt)
          cat release/SHA256SUMS.txt release/SIZES.txt
          fp="$(sed -n 's/^SHA-256 fingerprint: //p' "release/MyMedievalLife-B${n}-Android-signature.txt")"
          { if [ "${{ inputs.visibility }}" != "public" ]; then echo "**Private testing build:** a draft release, visible only to the repository's collaborators. Not for distribution; not uploaded to Steam."; echo; fi
            echo "Build ${n}, from \`${{ github.ref_name }}\` at commit ${{ github.sha }}. All six packages are built from that one commit."
            echo
            echo "**Full game**"
            echo "- Android: \`MyMedievalLife-B${n}-Android.apk\`, signed with the permanent release key (certificate SHA-256 \`${fp}\`). Later builds signed with this key install over it and keep the save."
            echo "- Windows: unzip and run \`MyMedievalLife.exe\`. Linux: unzip and run \`MyMedievalLife.x86_64\`."
            echo
            echo "**Demo** (120 minutes of play per world; a demo world continues in the full game)"
            echo "- Android: \`MyMedievalLife-B${n}-Demo-Android.apk\` (its own app, beside the full game; move a world across with Settings > Saves, Export in the demo and Import in the full game)."
            echo "- Windows: \`MyMedievalLife-B${n}-Demo-Windows.zip\`. Linux: \`MyMedievalLife-B${n}-Demo-Linux.zip\`."
            echo
            echo "\`SHA256SUMS.txt\` lists each file's checksum, \`SIZES.txt\` its size."
            echo
            if [ -f "docs/release/BUILD_${n}_TESTER_NOTES.md" ]; then cat "docs/release/BUILD_${n}_TESTER_NOTES.md"; echo; fi
            cat docs/release/TESTING_CHECKLIST.md; } > notes.md

      - name: Add the simulation gate's summary to the notes
        uses: actions/download-artifact@v4
        with:
          name: sim-gate
          path: sim-gate
          run-id: ${{ inputs.reuse_gate_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check the gate ran on this commit and write its section of the notes
        env:
          REUSE: ${{ inputs.reuse_gate_run }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          g = json.load(open("sim-gate/gate.json"))
          reuse = os.environ.get("REUSE", "")
          if not g["result"].startswith("PASS") or g.get("subset") or g.get("injected"):
              sys.exit("::error::the simulation gate did not pass (%s, %s)" % (g["commit"], g["result"]))
          note = ""
          if g["commit"] != os.environ["GITHUB_SHA"]:
              if not reuse:
                  sys.exit("::error::the simulation gate did not run on this commit (%s)" % g["commit"])
              # a reused gate stands only when nothing the simulation runs changed: no simulation code, data or gate tools
              changed = subprocess.run(["git", "diff", "--name-only", g["commit"], os.environ["GITHUB_SHA"]], capture_output=True, text=True, check=True).stdout.split()
              sim = [f for f in changed if f.startswith(("game/scripts/core/", "game/data/", "game/tests/economy_sim", "tools/sim_", "docs/release/sim_baseline"))]
              if sim:
                  sys.exit("::error::the reused gate's commit %s differs in simulation files: %s" % (g["commit"][:7], ", ".join(sim)))
              note = "\n- **Simulation gate reused (owner-approved):** this commit differs from the gate's commit `%s` only in %s, none of which the simulation runs.\n" % (g["commit"][:7], ", ".join("`%s`" % f for f in changed))
          summary = open("sim-gate/SIM_GATE_SUMMARY.md").read()
          with open("notes.md", "a") as f:
              f.write("\n" + summary + note + "\n- Simulation gate run: %s/%s/actions/runs/%s (artifact `sim-gate`); recorder schema `%s`.\n" % (
                  os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], reuse or os.environ["GITHUB_RUN_ID"], g["schema"]))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_number || github.run_number }}
          target_commitish: ${{ github.sha }}
          name: My Medieval Life — Build ${{ inputs.build_number || github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          draft: ${{ inputs.visibility != 'public' }}
          body_path: notes.md
          files: release/*

      # HAG-MEM-02 Part 3: a job summary on every outcome. Reporting only. PACKAGED is not RELEASED: a private draft is visible to
      # collaborators only, and nothing here uploads to Steam.
      - name: Report (job summary)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GATE_RESULT: ${{ needs.sim-gate.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            if [ "$VISIBILITY" = "public" ]; then outcome="PACKAGED and published on GitHub Releases (not uploaded to Steam)"; else outcome="PACKAGED as a private draft release (not RELEASED publicly; not uploaded to Steam)"; fi
          else
            outcome="FAILED ($JOB_STATUS): no complete six-package release from this run"
          fi
          {
            echo "## Build and release: build $BUILD_N"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Repository | $GITHUB_REPOSITORY |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT) |"
            echo "| Trigger | $GITHUB_EVENT_NAME by $GITHUB_ACTOR |"
            echo "| Visibility requested | $VISIBILITY |"
            echo "| Simulation gate job | $GATE_RESULT |"
            echo "| Package jobs (six) | $PACKAGE_RESULT |"
            echo "| Outcome | **$outcome** |"
            echo
            if [ -f release/SHA256SUMS.txt ]; then echo "Files:"; echo; echo '```'; cat release/SHA256SUMS.txt release/SIZES.txt; echo '```'; else echo "No release/SHA256SUMS.txt: packaging did not finish."; fi
          } >> "$GITHUB_STEP_SUMMARY"
