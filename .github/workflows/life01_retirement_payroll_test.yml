name: LIFE-01 focused red-green regression
on:
  push:
    branches: [audit/life01-retirement-payroll-20261108]
    paths: ["game/tests/life01_retirement_payroll_test.gd", "game/scripts/core/life.gd", ".github/workflows/life01_retirement_payroll_test.yml"]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot editor
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-linux-editor
      - name: Install editor if absent
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSfL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 ~/godot-bin/godot
      - name: Import project
        run: ~/godot-bin/godot --headless --path game --import >/tmp/import.log 2>&1 || { tail -80 /tmp/import.log; exit 1; }
      - name: Run only LIFE-01
        run: ~/godot-bin/godot --headless --path game --script res://tests/life01_retirement_payroll_test.gd
