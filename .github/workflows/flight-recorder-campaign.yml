name: Flight recorder campaign

# FLIGHT-REC-01, the owner's standing command "Run flight recorder" (owner directive 2026-11-02,
# docs/directives/2026-11-02_permanent_flight_recorder_simulation_system.md; docs/release/flight_recorder/README.md):
# independent 365-game-day simulations of normal integrated village play, seeds 1 and 2 by default, each fully recorded by the
# flight recorder, its whole archive checked and searched for abnormal behaviour, with a findings report and an Excel workbook.
#
# A reusable workflow: dispatched today through long-sims.yml (input flight: true; that file is on main, and GitHub runs the
# version on the dispatched ref, including the workflows it calls by a local path), and through flight-recorder.yml once that
# thin wrapper is on main. The caller sets the concurrency: one group per run, so no run, older or newer, is ever cancelled by
# another. At most two seeds simulate at once, each seed on its own chain of jobs (flight-recorder-seed.yml). Every result names
# its commit (GITHUB_SHA). Results are kept whatever happens: archives (30 days), logs, status, saved worlds, findings and
# workbook (90 days). It builds and publishes nothing.

on:
  workflow_call:
    inputs:
      seeds: {type: string, required: false, default: "1,2"}
      days: {type: string, required: false, default: "365"}
      every: {type: string, required: false, default: "10"}
      sim_args: {type: string, required: false, default: ""}
      record: {type: boolean, required: false, default: true}
      segment_days: {type: string, required: false, default: "100"}
      unsupported: {type: string, required: false, default: "", description: "the caller's inputs a flight run does not take (long-sims set and variants): must be empty"}
      godot_version: {type: string, required: false, default: "4.7.2"}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seeds: ${{ steps.p.outputs.seeds }}
      runs: ${{ steps.p.outputs.runs }}
      twin: ${{ steps.p.outputs.twin }}
      sim_args: ${{ steps.p.outputs.sim_args }}
      retention: ${{ steps.p.outputs.retention }}
      godot: ${{ steps.p.outputs.godot }}
    steps:
      - id: p
        env:
          SEEDS: ${{ inputs.seeds }}
          DAYS: ${{ inputs.days }}
          EVERY: ${{ inputs.every }}
          SIM_ARGS: ${{ inputs.sim_args }}
          SEGDAYS: ${{ inputs.segment_days }}
          UNSUPPORTED: ${{ inputs.unsupported }}
          GODOT_VERSION: ${{ inputs.godot_version }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          if os.environ.get("UNSUPPORTED", "").strip():
              sys.exit("a flight recorder run takes no balance overrides or comparison variants (long-sims set / variants): %r" % os.environ["UNSUPPORTED"])
          seeds = [s.strip() for s in os.environ["SEEDS"].split(",") if s.strip()]
          if not seeds or len(seeds) > 4 or not all(re.fullmatch(r"\d{1,9}", s) for s in seeds) or len(set(seeds)) != len(seeds):
              sys.exit("seeds: one to four different whole numbers")
          if not (re.fullmatch(r"\d{1,4}", os.environ["DAYS"]) and 1 <= int(os.environ["DAYS"]) <= 730):
              sys.exit("days: 1 to 730")
          every, seg, days = os.environ["EVERY"], os.environ["SEGDAYS"], os.environ["DAYS"]
          if not (re.fullmatch(r"\d{1,3}", every) and int(every) >= 1 and re.fullmatch(r"\d{1,4}", seg) and int(seg) >= 1):
              sys.exit("every and segment_days: whole numbers")
          if int(seg) % int(every) != 0:
              sys.exit("segment_days must be a multiple of every (a segment ends on a checkpoint)")
          if int(days) > 4 * int(seg):
              sys.exit("days must be at most 4 x segment_days (four chained jobs per seed)")
          if not re.fullmatch(r"((--aspiration|--job-choice|--economy|--market|--no-judgment|--twin|--scenario [a-z_]+|--at \d{1,3})( |$))*", os.environ.get("SIM_ARGS", "").strip()):
              sys.exit("sim_args: only --aspiration --job-choice --economy --market --no-judgment --twin --scenario NAME --at DAY")
          # B25R1-016: --twin is the campaign's own switch, never the simulation's: a second independent run of each seed with the same
          # configuration (the determinism comparison of event streams and fingerprints), the living-world reports over both, and the
          # archives kept 90 days. It is taken out of the simulation's arguments here.
          words = os.environ.get("SIM_ARGS", "").split()
          twin = "--twin" in words
          sim_args = " ".join(w for w in words if w != "--twin")
          runs = [{"seed": s, "tag": ""} for s in seeds] + ([{"seed": s, "tag": "-twin"} for s in seeds] if twin else [])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("seeds=%s\nruns=%s\ntwin=%s\nsim_args=%s\nretention=%s\ngodot=%s\n" % (json.dumps(seeds), json.dumps(runs), str(twin).lower(), sim_args,
                      "90" if twin else "30", os.environ["GODOT_VERSION"]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# Flight recorder campaign\n\n- Commit: `%s`\n- Seeds %s, %s days, checkpoints every %s, segments of %s days, record %s, sim_args `%s`\n- Run: %s/%s/actions/runs/%s\n" % (
                  os.environ["GITHUB_SHA"], ", ".join(seeds), days, every, seg, "${{ inputs.record }}", os.environ.get("SIM_ARGS", ""),
                  os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]))
          PY

  seed:
    needs: plan
    strategy:
      fail-fast: false          # the seeds are independent: one failing never stops the other
      # FLIGHT-REC-01's default: at most two runs simulating at once. With --twin (the B25R1 campaign; owner 2026-11-04, CI wall-clock):
      # every run at once, so each twin starts with its seed from the same initial state on its own runner instead of after it.
      max-parallel: ${{ needs.plan.outputs.twin == 'true' && 8 || 2 }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    uses: ./.github/workflows/flight-recorder-seed.yml
    with:
      seed: ${{ matrix.seed }}
      tag: ${{ matrix.tag }}
      retention_days: ${{ needs.plan.outputs.retention }}
      days: ${{ inputs.days }}
      every: ${{ inputs.every }}
      sim_args: ${{ needs.plan.outputs.sim_args }}
      record: ${{ inputs.record }}
      segment_days: ${{ inputs.segment_days }}
      godot_version: ${{ needs.plan.outputs.godot }}

  report:
    needs: [plan, seed]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch each seed's results
        uses: actions/download-artifact@v4
        with:
          pattern: fr-seed*-results
          path: results
      - name: Campaign summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          seeds = []
          for p in sorted(glob.glob("results/*/summary.json")):
              try:
                  seeds.append(json.load(open(p)))
              except (OSError, ValueError):
                  pass
          camp = {"format": "mml-flight-campaign/1", "run_url": os.environ["RUN_URL"], "commit": os.environ["GITHUB_SHA"], "seeds": seeds}
          os.makedirs("campaign", exist_ok=True)
          json.dump(camp, open("campaign/campaign.json", "w"), indent=1)
          L = ["## Campaign result", "", "Run: %s" % os.environ["RUN_URL"], "", "| seed | days reached | stopped | CRITICAL | HIGH | MEDIUM | confirmed defects |", "|---|---|---|---|---|---|---|"]
          for s in seeds:
              c = s.get("severity_counts") or {}
              L.append("| %s | %s of %s | %s | %s | %s | %s | %s |" % (s.get("seed"), s.get("days_reached"), s.get("days_requested"), s.get("stop_reason"),
                                                                 c.get("CRITICAL"), c.get("HIGH"), c.get("MEDIUM"), s.get("confirmed_defects")))
          if not seeds:
              L.append("| - | no seed produced results | | | | | |")
          L += ["", "Per seed: `fr-seed<N>-results` (findings.md, findings.json, summary.json, the workbook), `fr-seed<N>-seg<K>-archive` (the full archive), `fr-seed<N>-seg<K>-run` (log, status, sim.json)."]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(L) + "\n")
          print("\n".join(L))
          PY
      - name: Keep the campaign summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-recorder-campaign
          path: campaign
          retention-days: 90

  # B25R1-016 section 12: the targeted scenarios (game/tests/flight_scenarios.gd, game/data/flight_scenarios.json), one job per
  # scenario, in parallel with the campaign: rare features started from documented conditions and reported apart from the organic
  # run. With --twin only (the B25R1 campaign); kept 90 days.
  scenarios:
    needs: plan
    if: needs.plan.outputs.twin == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        name: [young_adult_homestead, established_adult_homestead, outlaw_homestead, youth_runaway, recruit_runaway, recruit_displaced_adult, recruit_orphan, bandit_departure]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ needs.plan.outputs.godot }}-linux-editor
      - name: Install Godot (editor only)
        if: steps.godot.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: ${{ needs.plan.outputs.godot }}
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot && rm godot.zip
      - name: Run the scenario
        env:
          NAME: ${{ matrix.name }}
        run: |
          out="$RUNNER_TEMP/targeted/$NAME"
          mkdir -p "$out"
          export XDG_DATA_HOME="$RUNNER_TEMP/ud" TMPDIR="$RUNNER_TEMP/tmp"
          mkdir -p "$XDG_DATA_HOME" "$TMPDIR"
          ~/godot-bin/godot --headless --path game --import > "$out/import.log" 2>&1 || true
          MML_COMMIT="$GITHUB_SHA" timeout 13800 ~/godot-bin/godot --headless --path game --script res://tests/flight_scenarios.gd -- --out "$out" --only "$NAME" > "$out/run.log" 2>&1 || echo "::warning::the scenario $NAME exited with $?"
          grep -E "SCENARIO|SCRIPT ERROR" "$out/run.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          ! grep -q "SCRIPT ERROR" "$out/run.log"
      - name: Keep the scenario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-targeted-${{ matrix.name }}
          path: ${{ runner.temp }}/targeted
          compression-level: 0
          retention-days: 90

  # B25R1-016 (owner directive 2026-11-03, 365-day flight recorder): with --twin, each seed's two independent runs are read together:
  # the living-world reports A-I over the first (tools/flight_lives.py) and the comparison of the two runs' event streams and
  # checkpoint fingerprints (identical, or the first day they differ). Kept 90 days.
  lives:
    needs: [plan, seed, scenarios]
    if: always() && needs.plan.outputs.twin == 'true'
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the run's archives and statuses
        uses: actions/download-artifact@v4
        with:
          pattern: fr-seed${{ matrix.seed }}-seg*
          path: ${{ runner.temp }}/dl
      - name: Fetch the twin's archives and statuses
        uses: actions/download-artifact@v4
        with:
          pattern: fr-seed${{ matrix.seed }}-twin-seg*
          path: ${{ runner.temp }}/dl
      - name: Fetch the targeted scenarios
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fr-targeted-*
          path: ${{ runner.temp }}/targeted
          merge-multiple: true
      - name: Lay the runs out
        env:
          SEED: ${{ matrix.seed }}
        run: |
          for tag in "" "-twin"; do
            run="$RUNNER_TEMP/run$tag"
            for d in "$RUNNER_TEMP"/dl/fr-seed$SEED$tag-seg*-run; do
              [ -d "$d" ] || continue
              n=$(basename "$d" | sed -E 's/.*-seg([0-9]+)-run/\1/')
              mkdir -p "$run/seg$n" && cp -r "$d"/. "$run/seg$n/"
              [ -f "$run/seg$n/sim.log.gz" ] && gunzip -f "$run/seg$n/sim.log.gz"
            done
            for d in "$RUNNER_TEMP"/dl/fr-seed$SEED$tag-seg*-archive; do
              [ -d "$d" ] || continue
              n=$(basename "$d" | sed -E 's/.*-seg([0-9]+)-archive/\1/')
              mkdir -p "$run/seg$n/rec" && mv "$d"/* "$run/seg$n/rec/" 2>/dev/null || true
            done
          done
          rm -rf "$RUNNER_TEMP/dl"
          du -sh "$RUNNER_TEMP"/run* || true
      - name: Living-world reports and the determinism comparison
        id: lives
        run: |
          out="$RUNNER_TEMP/lives"
          set +e
          python3 tools/flight_lives.py "$RUNNER_TEMP/run" --compare "$RUNNER_TEMP/run-twin" --targeted "$RUNNER_TEMP/targeted" --out "$out" > "$RUNNER_TEMP/lives.log" 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cp "$RUNNER_TEMP/lives.log" "$out/" 2>/dev/null || true
          cat "$RUNNER_TEMP/lives.log" | head -c 20000
          cat "$out/A_executive.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-living-world-seed${{ matrix.seed }}
          path: ${{ runner.temp }}/lives
          if-no-files-found: warn
          retention-days: 90
      - name: Fail when the two runs differ or the reports failed
        if: always()
        run: |
          [ "${{ steps.lives.outputs.code }}" = "0" ] || { echo "::error::the two runs of seed ${{ matrix.seed }} differ, or the reports failed: see lives.log and I_evidence_index.md"; exit 1; }
