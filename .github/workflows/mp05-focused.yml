name: MP-05 focused mutual sharing
on:
  push:
    branches: [feature/mp05-mutual-asset-share-20261108]
    paths: ["game/tests/mp05_mutual_asset_share_test.gd", "game/scripts/core/**", "game/scripts/net/**", "game/scripts/ui/player_window.gd", ".github/workflows/mp05-focused.yml"]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-linux-editor
      - name: Install
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSfL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 ~/godot-bin/godot
      - name: Import
        run: ~/godot-bin/godot --headless --path game --import >/tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
      - name: Focused
        run: ~/godot-bin/godot --headless --path game --script res://tests/mp05_mutual_asset_share_test.gd
