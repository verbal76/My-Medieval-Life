name: Long simulations

# Long-duration economy simulations on GitHub's runners, independent of any development container
# (owner approval 2026-10-20, docs/directives/2026-10-20_loft_and_actions_approval.md; register INFRA-02).
# Manual only: never on a push, so no year-long run starts by itself. Each seed is its own job on its own
# runner, with its own Godot user data, output and temporary paths. It runs the same harness as locally
# (game/tests/economy_sim.gd, unchanged rules and step), uploads the JSON, the log and a summary (commit,
# seed, days, runtime, fingerprint, currency and item ledgers) as an artifact, and fails when the
# simulation or its ledger checks fail, or when the log has any script error. It builds and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds, comma-separated (one job each)"
        default: "1"
        required: true
      days:
        description: "Game days to simulate"
        default: "10"
        required: true
      every:
        description: "Sample every N days"
        default: "10"
        required: true

permissions:
  contents: read

concurrency:
  group: long-sims             # one dispatch at a time; a second one waits rather than piling up
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seeds: ${{ steps.seeds.outputs.list }}
    steps:
      - id: seeds
        env:
          SEEDS: ${{ inputs.seeds }}
          DAYS: ${{ inputs.days }}
          EVERY: ${{ inputs.every }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          seeds = [s.strip() for s in os.environ["SEEDS"].split(",") if s.strip()]
          ok = seeds and all(re.fullmatch(r"\d{1,9}", s) for s in seeds) and len(seeds) <= 8
          ok = ok and re.fullmatch(r"\d{1,4}", os.environ["DAYS"]) and 1 <= int(os.environ["DAYS"]) <= 730
          ok = ok and re.fullmatch(r"\d{1,3}", os.environ["EVERY"]) and int(os.environ["EVERY"]) >= 1
          if not ok:
              sys.exit("seeds must be 1-8 whole numbers, days 1-730, every >= 1")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("list=" + json.dumps([int(s) for s in seeds]) + "\n")
          PY

  sim:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2          # at most two runners at once
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-editor

      - name: Install Godot (editor only)
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot && rm godot.zip

      - name: Simulate
        env:
          SEED: ${{ matrix.seed }}
          DAYS: ${{ inputs.days }}
          EVERY: ${{ inputs.every }}
        run: |
          out="$RUNNER_TEMP/sim-seed$SEED-days$DAYS"
          mkdir -p "$out/userdata" "$out/tmp"
          export XDG_DATA_HOME="$out/userdata" TMPDIR="$out/tmp"     # this run's own Godot user:// and temp files
          godot=~/godot-bin/godot
          $godot --headless --path game --import > "$out/import.log" 2>&1 || true
          start=$(date +%s)
          set +e
          timeout 19200 $godot --headless --path game --script res://tests/economy_sim.gd -- --days "$DAYS" --seed "$SEED" --every "$EVERY" --out "$out/sim.json" > "$out/sim.log" 2>&1
          code=$?
          set -e
          end=$(date +%s)
          errors=$(grep -c "SCRIPT ERROR" "$out/sim.log" || true)    # Godot reports script errors and carries on: count them
          python3 - "$out" "$code" "$((end - start))" "$errors" <<'PY'
          import json, os, sys
          out, code, secs, errors = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), int(sys.argv[4])
          summary = {"commit": os.environ["GITHUB_SHA"], "seed": int(os.environ["SEED"]), "days": int(os.environ["DAYS"]),
                     "runtime_seconds": secs, "exit_code": code, "script_errors": errors, "runner": os.environ.get("RUNNER_NAME", ""), "cpus": os.cpu_count()}
          try:
              d = json.load(open(os.path.join(out, "sim.json")))
              last = d["samples"][-1]
              summary.update({"fingerprint": d.get("fingerprint"), "currency": last.get("currency"),
                              "item_leaks": (last.get("ledger") or {}).get("items"), "alive": (last.get("people") or {}).get("alive"),
                              "people": {k: (last.get("people") or {}).get(k) for k in ("alive", "households", "births", "deaths", "by_job")},
                              "building": {k: (last.get("building") or {}).get(k) for k in ("sites_started", "sites_finished", "houses_built", "open_sites", "households_split", "lofts_started", "quarters_started", "rooms_started", "orphans_taken_in", "orphans_unplaced")},
                              "work": last.get("work"), "events": last.get("events")})
          except Exception as e:
              summary["error"] = "no simulation result: %s" % e
          json.dump(summary, open(os.path.join(out, "summary.json"), "w"), indent=1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Seed %d, %d days\n\n```json\n%s\n```\n" % (summary["seed"], summary["days"], json.dumps(summary, indent=1)))
          PY
          echo "OUT=$out" >> "$GITHUB_ENV"
          cat "$out/summary.json"                                      # the outcome at the end, in the log (artifacts are not always reachable)
          tail -n 30 "$out/sim.log"
          if [ "$code" -ne 0 ]; then
            echo "::error::the simulation or its ledger checks failed (exit $code); see sim.log"
            exit "$code"
          fi
          if [ "$errors" -ne 0 ]; then
            echo "::error::$errors script errors in the simulation; see sim.log"
            grep -m1 -A12 "SCRIPT ERROR" "$out/sim.log"
            exit 1
          fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-seed${{ matrix.seed }}-days${{ inputs.days }}
          path: |
            ${{ env.OUT }}/sim.json
            ${{ env.OUT }}/sim.log
            ${{ env.OUT }}/summary.json
          if-no-files-found: warn
          retention-days: 30
