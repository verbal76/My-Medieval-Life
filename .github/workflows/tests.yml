          $godot --headless --path game --script res://tests/judgment_perf.gd -- --sizes 100 --days 10
          # REC-19 (wip/recorder): the flight recorder, off by default; archive, context links, cap, recovery, coin audit
          $godot --headless --path game --script res://tests/recorder_test.gd
