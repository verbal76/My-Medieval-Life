          $godot --headless --path game --script res://tests/live_export_test.gd
          # Expansion 18 prospective suites (PROS-18, wip/expansion18-preparation only until integration)
          $godot --headless --path game --script res://tests/interdependency_test.gd   # WDR-002-C: Rule 2 verification scenario
          $godot --headless --path game --script res://tests/settlement_test.gd
          $godot --headless --path game --script res://tests/settlement_life_test.gd
          $godot --headless --path game --script res://tests/regional_test.gd
          $godot --headless --path game --script res://tests/capability_test.gd
          $godot --headless --path game --script res://tests/courier_test.gd
          $godot --headless --path game --script res://tests/contract_sign_test.gd
          $godot --headless --path game --script res://tests/experience_test.gd
          $godot --headless --path game --script res://tests/profile_test.gd       # SET-A/B: the maintained capability profile

      - name: Short economy simulation (FR-07)
        run: |
          # 10 game days, seed 1: fails on a currency or item leak (economy_sim's own exit code) and on any
          # script error in the log, which Godot reports without stopping. Year-long runs: long-sims.yml.
          godot=~/godot-bin/godot
          set +e
          timeout 900 $godot --headless --path game --script res://tests/economy_sim.gd -- --days 10 --seed 1 --every 5 --out "$RUNNER_TEMP/sim.json" > "$RUNNER_TEMP/sim.log" 2>&1
          code=$?
          set -e
          tail -n 12 "$RUNNER_TEMP/sim.log"
          errors=$(grep -c "SCRIPT ERROR" "$RUNNER_TEMP/sim.log" || true)
          if [ "$code" -ne 0 ] || [ "$errors" -ne 0 ]; then
            grep -m1 -A12 "SCRIPT ERROR" "$RUNNER_TEMP/sim.log" || true
            echo "::error::economy simulation failed (exit $code, $errors script errors)"
            exit 1
          fi
