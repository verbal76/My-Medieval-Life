          res://tests/mp_interact_ui_test.gd     # MP-INTERACT-01: one player choosing another and the approved verbs
          # the same over loopback (each starts its host and guest Godot processes itself, as net_g1 does)
          res://tests/net_family_test.gd         # MP-PLAYER-FAMILY between two processes
          res://tests/net_interact_test.gd       # MP-INTERACT-01 between three processes
          res://tests/mp05_mutual_asset_share_test.gd   # MP-05: owner-approved gameplay regression
          res://tests/mp05_forged_client_test.gd       # MP-05: a modified guest client's forged requests refused by the host
          res://tests/mp06_away_reach_test.gd          # MML-MP-06: a modified guest's requests while away or out of reach refused; rejoin acts
          res://tests/mp06_guest_trust_test.gd         # MP-GUEST-TRUST: a guest's own xp, damage, craft completion and work figures refused; host computes
          res://tests/nd28_guest_pace_test.gd          # ND-28: a guest's mining, felling and sword blows paced and reach-checked by the single-player rules
          res://tests/mp07_private_records_test.gd     # MML-MP-07: a guest is sent no other player's private records (welcome and syncs)
          res://tests/mp03_forged_store_test.gd        # B25-AUD-MP-03: a guest may name only stores it has the right to
          res://tests/mp03_public_tables_test.gd       # B25-MP03-TABLES-D1: a guest may name a genuinely public table within reach
          res://tests/mp03_household_tables_test.gd    # B25-MP03-OWNERSHIP-D1: owned and shared containers by the property rule; tavern tables private
          res://tests/emp03_seeker_count_test.gd        # EMP-03: ambitious lookers counted as seekers in the hiring competition
          res://tests/net_fault_test.gd          # MP Batch D: invite codes, loss, reordering, pauses, killed and restarted hosts
          res://tests/net_liveness_test.gd      # ND-26: the reliable heartbeat watchdog (frozen guest or host dropped within TIMEOUT_MAX_MS)
          res://tests/net_mp4_test.gd            # X20 phase 4.5: one host with two, then three guests (four players)
          res://tests/net_recorder_quit_test.gd  # X20: a flight recording ends whenever its world is closed in order
          res://tests/net_soak_test.gd           # X20 item 11: a recorded multiplayer soak, one host and three guests (~3-4 min)
          EOF
          if [ -n "$ONLY" ]; then   # an independent run of named suites: keep only those entries of the list
            for t in $ONLY; do grep -E "^ *$t( |$)" "$RUNNER_TEMP/game.txt" || { echo "unknown suite: $t"; exit 1; }; done > "$RUNNER_TEMP/only.txt"
            mv "$RUNNER_TEMP/only.txt" "$RUNNER_TEMP/game.txt.only"
          fi
          if [ -n "$GROUP" ]; then   # subsystem groups (tools/ci_groups.json): suites whose file name matches a group's patterns
            python3 tools/ci_groups.py "$RUNNER_TEMP/game.txt" $GROUP > "$RUNNER_TEMP/game.txt.group"
            echo "group(s) $GROUP: $(grep -c . "$RUNNER_TEMP/game.txt.group") suite(s)"
          fi
          if [ -n "$ONLY$GROUP" ]; then   # the union of 'only' and the groups, each suite once
            cat "$RUNNER_TEMP"/game.txt.only "$RUNNER_TEMP"/game.txt.group 2>/dev/null | awk '!seen[$1]++' > "$RUNNER_TEMP/game.txt"
            [ -s "$RUNNER_TEMP/game.txt" ] || { echo "no suite selected"; exit 1; }
          fi
          python3 tools/ci_plan.py tests-shard --list "$RUNNER_TEMP/game.txt" --shards "$SHARDS" --shard "$SHARD" \
            --out "$RUNNER_TEMP/game_shard.txt" --manifest "$CI_OUT/shard.json"
          # TEST-GOV-01: a suite fails on a SCRIPT ERROR (a check cut short), when it prints no check count, and when it runs
          # fewer checks than its floor (tools/ci_check_floors.json): an early stop can no longer pass
          python3 tools/ci_report.py run --group game --list "$RUNNER_TEMP/game_shard.txt" --prefix "$HOME/godot-bin/godot --headless --path game --script" --logs "$CI_OUT/logs" --results "$CI_OUT/results.jsonl" --fail-on-script-errors --require-counts --floors tools/ci_check_floors.json

      - name: Short economy simulation (FR-07)
        id: sim
        if: ${{ !cancelled() && steps.import.outcome == 'success' && matrix.shard == 0 && needs.plan.outputs.targeted != 'true' }}
        run: |
          # 10 game days, seed 1: fails on a currency or item leak (economy_sim's own exit code) and on any
          # script error in the log, which Godot reports without stopping. Year-long runs: long-sims.yml.
          echo 'res://tests/economy_sim.gd -- --days 10 --seed 1 --every 5 --out "$CI_OUT/sim.json"' > "$RUNNER_TEMP/sim.txt"
          python3 tools/ci_report.py run --group sim --list "$RUNNER_TEMP/sim.txt" --prefix "$HOME/godot-bin/godot --headless --path game --script" --logs "$CI_OUT/logs" --results "$CI_OUT/results.jsonl" --timeout 900 --fail-on-script-errors

      # The report never decides the outcome: the steps above already failed if a suite did. It runs whatever happened,
      # writes the job summary and ci-report.json (mml-ci-report/1), and names any missing evidence.
      - name: Report (job summary and ci-report.json)
        if: always()
        run: |
          # game results are expected unless the planner gave this shard no suites (an 'only' run of fewer suites than
          # shards): then the plan file exists and is empty, and the report job's coverage check still proves every listed
          # suite was assigned exactly once. A shard whose plan never ran (no file) still expects game results.
          EXPECT_GAME="--expect game"
          if [ -f "$RUNNER_TEMP/game_shard.txt" ] && ! grep -q '[^[:space:]]' "$RUNNER_TEMP/game_shard.txt"; then EXPECT_GAME=""; fi
          python3 tools/ci_report.py report --results "$CI_OUT/results.jsonl" \
            ${{ (matrix.shard == 0 && needs.plan.outputs.targeted != 'true') && '--expect python --expect sim' || '' }} $EXPECT_GAME \
            ${{ (matrix.shard == 0 && needs.plan.outputs.targeted != 'true') && format('--step python={0} --step sim={1}', steps.python.outcome, steps.sim.outcome) || '' }} \
            --step import=${{ steps.import.outcome }} --step game=${{ steps.game.outcome }} \
            --started "$CI_STARTED" \
            --purpose "Automated Python, data and headless Godot suites plus a 10-day economy smoke run on this commit (tests.yml; ${{ github.event_name }})" \
            --json "$CI_OUT/ci-report.json" --markdown "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: Keep the report and per-suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: ci-out
          if-no-files-found: warn
          retention-days: 30

  # B25R1 CI architecture: one report for this commit over every shard. It fails when a shard is missing, cancelled, skipped or
  # timed out, ran another commit or another suite list, or when the shards' suites do not cover the list exactly once.
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read            # the run's own jobs (conclusions and times)
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Fetch every shard's report
        uses: actions/download-artifact@v4
        with:
          pattern: ci-report-${{ github.run_id }}-*-shard*
          path: shards-all
      # Owner 2026-11-10 (Actions testing directive: a failed job must not force re-running successful ones): after "re-run
      # failed jobs" only the re-run shards upload new reports, so each shard's LATEST attempt is kept (a shard that passed in
      # attempt 1 counts with its attempt-1 report). Every shard still has to be present.
      - name: Keep each shard's latest attempt
        run: |
          mkdir -p shards
          python3 - <<'PY'
          import glob, os, re, shutil
          best = {}
          for d in glob.glob("shards-all/ci-report-*-*-shard*"):
              m = re.search(r"ci-report-\d+-(\d+)-shard(\d+)$", d)
              if m and int(m.group(1)) >= best.get(int(m.group(2)), (0, ""))[0]:
                  best[int(m.group(2))] = (int(m.group(1)), d)
          for k, (att, d) in sorted(best.items()):
              print("shard %d: attempt %d" % (k, att))
              shutil.copytree(d, os.path.join("shards", os.path.basename(d)))
          PY
      - name: Consolidated report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --attempt "$GITHUB_RUN_ATTEMPT" --json headSha,status,conclusion,jobs > run.json || echo '{}' > run.json
          python3 tools/ci_consolidate.py --sha "$GITHUB_SHA" --tests shards --meta tests=run.json --require tests \
            --json validation/validation.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Keep the consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation
          if-no-files-found: warn
          retention-days: 30
