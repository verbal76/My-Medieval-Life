          $godot --headless --path game --script res://tests/prospecting_test.gd
          $godot --headless --path game --script res://tests/discovery_test.gd
          $godot --headless --path game --script res://tests/openpit_test.gd
          $godot --headless --path game --script res://tests/services_test.gd
          $godot --headless --path game --script res://tests/underground_ext_test.gd
          $godot --headless --path game --script res://tests/underground_struct_test.gd
          # PROSPECTIVE Expansion 19 (PROS-19, wip/expansion19-preparation): the isolated judgment prototype
          $godot --headless --path game --script res://tests/judgment_test.gd
          $godot --headless --path game --script res://tests/judgment_live_test.gd
          $godot --headless --path game --script res://tests/judgment_personality_test.gd
          $godot --headless --path game --script res://tests/judgment_bonds_test.gd
