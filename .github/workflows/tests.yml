# Runs the automated tests when the development branch changes. It builds no game files and
# publishes nothing (owner, 2026-10-18: development pushes must never publish).
#
# To keep GitHub-hosted minutes low: only pushes to staging/my-medieval-life that change code, data
# or tests start it; a newer push cancels a run still in progress; Godot (the editor only, no export
# templates) is cached by version. Add "[skip ci]" to a commit message to skip a run.
name: Tests

on:
  push:
    branches: [staging/my-medieval-life]
    paths: ["game/**", "tools/**", "tests/**", "data/**", "docs/SYSTEM_INTERACTION_MANIFEST.md", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2           # the requirements check compares the register with the previous commit

      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-editor

      - name: Install Godot (editor only)
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot && rm godot.zip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools' dependencies (Pillow, numpy)
        run: python3 -m pip install pillow==10.4.0 numpy==2.1.3

      - name: Python tests and data checks
        run: |
          python3 -m unittest discover -s tests
          python3 tools/check_interactions.py
          python3 tools/check_requirements.py --against HEAD~1   # no approved requirement lost or closed without a record
          python3 tools/check_resources.py
          python3 tools/check_materials.py   # material and profession coverage (WDR-007-C); fails on broken references or stale exceptions

      - name: Game tests (headless)
        run: |
          godot=~/godot-bin/godot
          $godot --headless --path game --import
          $godot --headless --path game --script res://tests/run_tests.gd
          $godot --headless --path game --script res://tests/start_test.gd
          $godot --headless --path game --script res://tests/character_look_test.gd
          $godot --headless --path game --script res://tests/furniture_test.gd
          $godot --headless --path game --script res://tests/play_test.gd
          $godot --headless --path game --script res://tests/overworld_test.gd
          $godot --headless --path game --script res://tests/tree_test.gd
          $godot --headless --path game --script res://tests/world_test.gd
          $godot --headless --path game --script res://tests/aging_test.gd
          $godot --headless --path game --script res://tests/wiki_test.gd
          $godot --headless --path game --script res://tests/audio_test.gd
          $godot --headless --path game --script res://tests/stone_test.gd
          $godot --headless --path game --script res://tests/job_board_test.gd
          $godot --headless --path game --script res://tests/early_game_test.gd
          $godot --headless --path game --script res://tests/parity_mining_test.gd
          $godot --headless --path game --script res://tests/equip_test.gd
          $godot --headless --path game --script res://tests/inventory18_test.gd
          $godot --headless --path game --script res://tests/crop_share_test.gd
          $godot --headless --path game --script res://tests/skills_test.gd
          $godot --headless --path game --script res://tests/chests_test.gd
          $godot --headless --path game --script res://tests/property_test.gd
          $godot --headless --path game --script res://tests/business_test.gd
          $godot --headless --path game --script res://tests/business_money_test.gd
          $godot --headless --path game --script res://tests/business_works_test.gd
          # Build 18 suites (REL18-SUITES: every suite runs in CI)
          $godot --headless --path game --script res://tests/chapel_test.gd
          $godot --headless --path game --script res://tests/competition_test.gd
          $godot --headless --path game --script res://tests/countryside_test.gd
          $godot --headless --path game --script res://tests/courier_live_test.gd
          $godot --headless --path game --script res://tests/credit_test.gd
          $godot --headless --path game --script res://tests/feast_test.gd
          $godot --headless --path game --script res://tests/horse_test.gd
          $godot --headless --path game --script res://tests/luxury_test.gd
          $godot --headless --path game --script res://tests/migration_test.gd
          $godot --headless --path game --script res://tests/identity_test.gd
          $godot --headless --path game --script res://tests/multiplayer_a1_test.gd
          # MP Batch A2, gate G1: a host and a guest in two Godot processes over loopback (join, move, an action the host applies, same state, rejoin, host restart)
          $godot --headless --path game --script res://tests/net_g1_test.gd
          # GP-POLISH P1 (owner directive 2026-10-24): stations opened by a tap on them; the mining swing on touch; the touch action columns
          $godot --headless --path game --script res://tests/station_tap_test.gd
          # (GP-ACTIONBAR and GP-PICKAXE-ANIM are checked in start_test.gd)
          # GP-POLISH P2 (the owner's reports of 2026-10-24): drawing order at house fronts and the rest of the batch
          $godot --headless --path game --script res://tests/polish_p2_test.gd
          $godot --headless --path game --script res://tests/outlaw_return_test.gd
          $godot --headless --path game --script res://tests/party_test.gd
          $godot --headless --path game --script res://tests/regional_food_test.gd
          $godot --headless --path game --script res://tests/regions_test.gd
          $godot --headless --path game --script res://tests/settlement_development_test.gd
          $godot --headless --path game --script res://tests/tailor_barber_test.gd
          $godot --headless --path game --script res://tests/tax_test.gd
          $godot --headless --path game --script res://tests/trade_skills_test.gd
          $godot --headless --path game --script res://tests/farming_test.gd
          $godot --headless --path game --script res://tests/health_jobs_test.gd
          $godot --headless --path game --script res://tests/home_test.gd
          $godot --headless --path game --script res://tests/wildlife_test.gd
          $godot --headless --path game --script res://tests/refuge_test.gd
          $godot --headless --path game --script res://tests/combat_test.gd
          $godot --headless --path game --script res://tests/relations_test.gd
          $godot --headless --path game --script res://tests/dialogue_perspective_test.gd   # REPAIR S1-S2: who speaks to whom, from what they know
          $godot --headless --path game --script res://tests/save_transfer_test.gd
          $godot --headless --path game --script res://tests/housing_test.gd
          $godot --headless --path game --script res://tests/conservation_test.gd
          $godot --headless --path game --script res://tests/recf1_test.gd
          $godot --headless --path game --script res://tests/family_test.gd
          $godot --headless --path game --script res://tests/od16_test.gd
          $godot --headless --path game --script res://tests/parity_test.gd
          $godot --headless --path game --script res://tests/reserve_test.gd
          $godot --headless --path game --script res://tests/treasury_test.gd
          $godot --headless --path game --script res://tests/exploit_test.gd
          $godot --headless --path game --script res://tests/succession_test.gd
          $godot --headless --path game --script res://tests/ecology_test.gd
          $godot --headless --path game --script res://tests/stalls_test.gd
          $godot --headless --path game --script res://tests/farm_plots_test.gd
          $godot --headless --path game --script res://tests/farm_place_test.gd
          $godot --headless --path game --script res://tests/herd_test.gd
          $godot --headless --path game --script res://tests/contracts_test.gd
          $godot --headless --path game --script res://tests/contract_50ore_test.gd
          $godot --headless --path game --script res://tests/decay_test.gd
          $godot --headless --path game --script res://tests/terrain_test.gd
          $godot --headless --path game --script res://tests/underground_test.gd
          $godot --headless --path game --script res://tests/quarry_test.gd
          $godot --headless --path game --script res://tests/crafts_test.gd
          $godot --headless --path game --script res://tests/prospecting_test.gd
          $godot --headless --path game --script res://tests/discovery_test.gd
          $godot --headless --path game --script res://tests/openpit_test.gd
          $godot --headless --path game --script res://tests/services_test.gd
          $godot --headless --path game --script res://tests/underground_ext_test.gd
          $godot --headless --path game --script res://tests/underground_struct_test.gd
          # PROSPECTIVE Expansion 19 (PROS-19, wip/expansion19-preparation): the isolated judgment prototype
          $godot --headless --path game --script res://tests/judgment_test.gd
          $godot --headless --path game --script res://tests/judgment_live_test.gd
          $godot --headless --path game --script res://tests/judgment_personality_test.gd
          $godot --headless --path game --script res://tests/judgment_bonds_test.gd
          $godot --headless --path game --script res://tests/family_first_test.gd
          $godot --headless --path game --script res://tests/judgment_x19_test.gd
          $godot --headless --path game --script res://tests/judgment_guard_save_test.gd
          $godot --headless --path game --script res://tests/judgment_decay_demo.gd
          $godot --headless --path game --script res://tests/judgment_perf.gd -- --sizes 100 --days 10
          # REC-19 (wip/recorder): the flight recorder, off by default; archive, context links, cap, recovery, coin audit
          $godot --headless --path game --script res://tests/recorder_test.gd
          # Expansion 18 prospective suites (PROS-18, wip/expansion18-preparation only until integration)
          $godot --headless --path game --script res://tests/interdependency_test.gd   # WDR-002-C: Rule 2 verification scenario
          $godot --headless --path game --script res://tests/settlement_test.gd
          $godot --headless --path game --script res://tests/settlement_life_test.gd
          $godot --headless --path game --script res://tests/regional_test.gd
          $godot --headless --path game --script res://tests/capability_test.gd
          $godot --headless --path game --script res://tests/courier_test.gd
          $godot --headless --path game --script res://tests/contract_sign_test.gd
          $godot --headless --path game --script res://tests/experience_test.gd
          $godot --headless --path game --script res://tests/profile_test.gd       # SET-A/B: the maintained capability profile

      - name: Short economy simulation (FR-07)
        run: |
          # 10 game days, seed 1: fails on a currency or item leak (economy_sim's own exit code) and on any
          # script error in the log, which Godot reports without stopping. Year-long runs: long-sims.yml.
          godot=~/godot-bin/godot
          set +e
          timeout 900 $godot --headless --path game --script res://tests/economy_sim.gd -- --days 10 --seed 1 --every 5 --out "$RUNNER_TEMP/sim.json" > "$RUNNER_TEMP/sim.log" 2>&1
          code=$?
          set -e
          tail -n 12 "$RUNNER_TEMP/sim.log"
          errors=$(grep -c "SCRIPT ERROR" "$RUNNER_TEMP/sim.log" || true)
          if [ "$code" -ne 0 ] || [ "$errors" -ne 0 ]; then
            grep -m1 -A12 "SCRIPT ERROR" "$RUNNER_TEMP/sim.log" || true
            echo "::error::economy simulation failed (exit $code, $errors script errors)"
            exit 1
          fi
