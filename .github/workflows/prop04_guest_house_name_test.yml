name: PROP-04 focused red-green check
on:
  push:
    branches: [audit/prop04-guest-house-name-20261108]
    paths: ["game/tests/prop04_guest_house_name_test.gd", "game/scripts/core/world.gd", ".github/workflows/prop04_guest_house_name_test.yml"]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot editor
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-linux-editor
      - name: Get Godot if not cached
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSfL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 ~/godot-bin/godot
      - name: Import project
        run: ~/godot-bin/godot --headless --path game --import >/tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
      - name: PROP-04 test only
        run: ~/godot-bin/godot --headless --path game --script res://tests/prop04_guest_house_name_test.gd
