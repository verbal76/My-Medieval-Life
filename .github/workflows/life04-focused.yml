name: LIFE-04 focused marital continuity
on:
  push:
    branches: [feature/life04-widow-remarriage-20261108]
    paths: ["game/tests/life04_remarriage_test.gd", "game/scripts/core/life.gd", "game/scripts/core/relations.gd", "game/scripts/core/npc.gd", "game/scripts/core/player_state.gd", ".github/workflows/life04-focused.yml"]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-linux-editor
      - name: Install editor
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSfL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 ~/godot-bin/godot
      - name: Import
        run: ~/godot-bin/godot --headless --path game --import >/tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
      - name: Test
        run: ~/godot-bin/godot --headless --path game --script res://tests/life04_remarriage_test.gd
